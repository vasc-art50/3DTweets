<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Base Dark Background Gradient -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161D" />
      <stop offset="100%" stop-color="#171E26" />
    </linearGradient>

    <!-- Warm Orange Ambient Glow (Top-Right) -->
    <radialGradient id="orange-glow" cx="82%" cy="22%" r="65%" fx="82%" fy="22%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#FF5A1F" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#141A21" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Diagonal Engineering Grid -->
    <pattern id="diag-grid" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <line x1="0" y1="0" x2="0" y2="80" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
      <line x1="0" y1="0" x2="80" y2="0" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="630" fill="url(#bg-base)" />
  <rect width="1200" height="630" fill="url(#diag-grid)" />
  <rect width="1200" height="630" fill="url(#orange-glow)" />

  <!-- Subtle Accent Eyebrow -->
  <text x="600" y="258" text-anchor="middle" fill="#FF5A1F" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="7">
    DESIGN · PRINT · BUILD
  </text>

  <!-- Centered Bold Wordmark -->
  <text x="600" y="348" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="4">
    3D TWEETS
  </text>

  <!-- Subtle Bottom Domain Tag -->
  <text x="600" y="404" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="2">
    3dtweets.com
  </text>
</svg>