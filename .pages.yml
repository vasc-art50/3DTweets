media:
  - name: blog-images
    label: Blog images
    input: src/assets/models
    output: ../../assets/models
    rename: false
    categories: [image]
    extensions: [avif, jpg, jpeg, png, webp]
  - name: tweetone-images
    label: TweetONE images
    input: src/assets/models
    output: ../../../assets/models
    rename: false
    categories: [image]
    extensions: [avif, jpg, jpeg, png, webp]

content:
  - name: blog
    label: Blog (EN)
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [title, pubDate, category]
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: pubDate
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        type: date
        required: false
        options:
          format: yyyy-MM-dd
      - name: tags
        type: string
        list: true
        default: []
      - name: category
        type: select
        default: projects
        options:
          values:
            - name: projects
              label: Projects & Guides
            - name: our-models
              label: Our Models
            - name: TweetONE
              label: TweetONE
      - name: printablesUrl
        type: string
        required: false
        description: Optional absolute URL to the printable/model page.
      - name: author
        type: string
        required: false
        default: 3DTweet team
      - name: printSpecs
        type: object
        required: false
        fields:
          - name: material
            type: string
            required: false
          - name: layerHeight
            type: string
            required: false
          - name: infill
            type: string
            required: false
          - name: supports
            type: string
            required: false
      - name: heroImage
        type: image
        required: false
        description: Uploads go to src/assets/models; the saved path is relative, for example ../../assets/models/filename.webp.
        options:
          media: blog-images
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: galleryFolder
        type: string
        required: false
        description: Složka v src/assets, například models/henrys-shave.
      - name: gallery
        type: image
        required: false
        description: Uploads go to src/assets/models; the saved path is relative, for example ../../assets/models/filename.webp.
        options:
          media: blog-images
          multiple: true
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: body
        type: rich-text
        description: Inline image uploads go to src/assets/models and use relative ../../assets/models/ paths.
        options:
          media: blog-images
          format: markdown
          rename: false

  - name: blog-cs
    label: Blog (CS)
    type: collection
    path: src/content/blog-cs
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    operations:
      rename: false
