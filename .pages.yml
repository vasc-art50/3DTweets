          media: blog-images
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: galleryFolder
        type: string
        required: false
        description: Folder under src/assets, for example models/henrys-shave.
      - name: gallery
        type: image
        required: false
        description: Nahrané obrázky se ukládají do src/assets/models; cesta je relativní, např. ../../assets/models/filename.webp.
        options:
          media: blog-images
          multiple: true
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: body
        type: rich-text
        description: Obrázky vložené do textu se ukládají do src/assets/models a používají relativní cestu ../../assets/models/.
        options:
          media: blog-images
          format: markdown
          rename: false

  - name: tweetone-cs
    label: TweetONE Dokumentace (CS)
    type: collection
    path: src/content/tweetone/cs
    format: yaml-frontmatter
    filename: "{title}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [order, title, eyebrow]
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: eyebrow
        label: Nadpis štítku
        type: string
        required: true
      - name: title
        label: Nadpis sekce
        type: string
        required: true
      - name: order
        label: Pořadí sekce
        type: number
        required: true
      - name: altBackground
        label: Střídavé pozadí sekce
        type: boolean
        default: false
      - name: heroImage
        label: Úvodní obrázek
        type: image
        required: false
        options:
          media: tweetone-images
          path: models/tweet-one
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: galleryFolder
        label: Složka galerie v src/assets
        type: string
        required: false
        description: Relativní cesta, například models/tweet-one.
      - name: gallery
        label: Galerie
        type: image
        list: true
        required: false
        options:
          media: tweetone-images
          path: models/tweet-one
          multiple: true
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: specs
        label: Technické parametry
        type: object
        list: true
        required: false
        fields:
          - name: label
            label: Parametr
            type: string
            required: true
          - name: value
            label: Hodnota
            type: string
            required: true
      - name: body
        label: Text sekce (Markdown)
        type: rich-text
        description: Obrázky se ukládají do src/assets/models a používají relativní cestu ../../../assets/models/.
        options:
          media: tweetone-images
          path: models/tweet-one
          format: markdown
          rename: false
          switcher: true

  - name: tweetone-en
    label: TweetONE Documentation (EN)
    type: collection
    path: src/content/tweetone/en
    format: yaml-frontmatter
    filename: "{title}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [order, title, eyebrow]
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: eyebrow
        label: Section eyebrow
        type: string
        required: true
      - name: title
        label: Section heading
        type: string
        required: true
      - name: order
        label: Section order
        type: number
        required: true
      - name: altBackground
        label: Use alternating section background
        type: boolean
        default: false
      - name: heroImage
        label: Hero image
        type: image
        required: false
        options:
          media: tweetone-images
          path: models/tweet-one
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: galleryFolder
        label: Gallery folder under src/assets
        type: string
        required: false
        description: Relative path, for example models/tweet-one.
      - name: gallery
        label: Gallery images
        type: image
        list: true
        required: false
        options:
          media: tweetone-images
          path: models/tweet-one
          multiple: true
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: specs
        label: Technical specifications
        type: object
        list: true
        required: false
        fields:
          - name: label
            label: Specification
            type: string
            required: true
          - name: value
            label: Value
            type: string
            required: true
      - name: body
        label: Section body (Markdown)
        type: rich-text
        description: Inline images are stored in src/assets/models and use relative ../../../assets/models/ paths.
        options:
          media: tweetone-images
          path: models/tweet-one
          format: markdown
          switcher: true
          rename: false
