          - name: material
            type: string
            required: false
          - name: layerHeight
            type: string
            required: false
          - name: infill
            type: string
            required: false
          - name: supports
            type: string
            required: false
      - name: heroImage
        type: image
        required: false
        description: Nahrané obrázky se ukládají do src/assets/models; cesta je relativní, např. ../../assets/models/filename.webp.
