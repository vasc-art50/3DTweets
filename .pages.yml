    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: pubDate
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        type: date
        required: false
        options:
          format: yyyy-MM-dd
      - name: tags
        type: string
        list: true
        default: []
      - name: category
        type: select
