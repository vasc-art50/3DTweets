media:
  input: src/assets/models
  output: ../../assets/models
  rename: false
  categories: [image]
  extensions: [avif, jpg, jpeg, png, webp]

content:
  - name: blog
    label: Blog (EN)
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [title, pubDate, category]
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: pubDate
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        type: date
        required: false
        options:
          format: yyyy-MM-dd
      - name: tags
        type: string
        list: true
        default: []
      - name: category
        type: select
        default: projects
        options:
          values:
            - name: projects
              label: Projects & Guides
            - name: our-models
              label: Our Models
            - name: TweetONE
              label: TweetONE
      - name: printablesUrl
        type: string
        required: false
        description: Optional absolute URL to the printable/model page.
      - name: author
        type: string
        required: false
        default: 3DTweet team
      - name: printSpecs
        type: object
        required: false
        fields:
          - name: material
            type: string
            required: false
          - name: layerHeight
            type: string
            required: false
          - name: infill
            type: string
            required: false
          - name: supports
            type: string
            required: false
      - name: heroImage
        type: image
        required: false
        description: Uploads go to src/assets/models; the saved path is relative, for example ../../assets/models/filename.webp.
        options:
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: galleryFolder
        type: string
        required: false
        description: Složka v src/assets, například models/henrys-shave.
      - name: gallery
        type: image
        required: false
        description: Uploads go to src/assets/models; the saved path is relative, for example ../../assets/models/filename.webp.
        options:
          multiple: true
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: body
        type: rich-text
        description: Inline image uploads go to src/assets/models and use relative ../../assets/models/ paths.
        options:
          format: markdown
          rename: false

  - name: blog-cs
    label: Blog (CS)
    type: collection
    path: src/content/blog-cs
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [title, pubDate, category]
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: pubDate
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        type: date
        required: false
        options:
          format: yyyy-MM-dd
      - name: tags
        type: string
        list: true
        default: []
      - name: category
        type: select
        default: projects
        options:
          values:
            - name: projects
              label: Projekty & Návody
            - name: our-models
              label: Naše modely
            - name: TweetONE
              label: TweetONE
      - name: printablesUrl
        type: string
        required: false
        description: Volitelná absolutní URL adresa stránky modelu nebo tisku.
      - name: author
        type: string
        required: false
        default: 3DTweet team
      - name: printSpecs
        type: object
        required: false
        fields:
          - name: material
            type: string
            required: false
          - name: layerHeight
            type: string
            required: false
          - name: infill
            type: string
            required: false
          - name: supports
            type: string
            required: false
      - name: heroImage
        type: image
        required: false
        description: Nahrané obrázky se ukládají do src/assets/models; cesta je relativní, např. ../../assets/models/filename.webp.
        options:
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: galleryFolder
        type: string
        required: false
        description: Folder under src/assets, for example models/henrys-shave.
      - name: gallery
        type: image
        required: false
        description: Nahrané obrázky se ukládají do src/assets/models; cesta je relativní, např. ../../assets/models/filename.webp.
        options:
          multiple: true
          extensions: [avif, jpg, jpeg, png, webp]
          rename: false
      - name: body
        type: rich-text
        description: Obrázky vložené do textu se ukládají do src/assets/models a používají relativní cestu ../../assets/models/.
        options:
          format: markdown
          rename: false

  - name: tweetone-cs
    label: TweetONE Dokumentace (CS)
    type: collection
    path: src/content/tweetone/cs
    format: yaml-frontmatter
    filename: "{title}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [order, title, eyebrow]
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: eyebrow
        label: Nadpis štítku
        type: string
        required: true
      - name: title
        label: Nadpis sekce
        type: string
        required: true
      - name: order
        label: Pořadí sekce
        type: number
        required: true
      - name: layout
        label: Typ rozložení
        type: select
        default: cards
        options:
          values: [overview, setup, hardware, cards, reference]
      - name: altBackground
        label: Střídavé pozadí sekce
        type: boolean
        default: false
      - name: highlightBox
        label: Úvodní karta Fáze 0
        type: object
        required: false
        fields:
          - name: eyebrow
            label: Štítek karty
            type: string
            required: true
          - name: goal
            label: Cíl
            type: text
            required: true
          - name: experiment
            label: Test
            type: text
            required: true
          - name: result
            label: Výsledek
            type: text
            required: true
      - name: cards
        label: Karty sekce
        type: object
        list: true
        fields:
          - name: eyebrow
            label: Štítek karty
            type: string
            required: false
          - name: title
            label: Nadpis karty
            type: string
            required: false
          - name: date
            label: Datum nebo období
            type: string
            required: false
          - name: text
            label: Text karty
            type: text
            required: false
          - name: cause
            label: Příčina problému
            type: text
            required: false
          - name: fix
            label: Řešení problému
            type: text
            required: false
          - name: fixPrefix
            label: Začátek řešení před kódem
            type: text
            required: false
          - name: inlineCode
            label: Krátký kód v řešení
            type: string
            required: false
          - name: fixSuffix
            label: Konec řešení za kódem
            type: text
            required: false
          - name: items
            label: Položky seznamu
            type: string
            list: true
            required: false
          - name: code
            label: Konfigurační nebo terminálový kód
            type: text
            required: false
          - name: column
            label: Šířka karty v řádku
            type: select
            default: is-6
            options:
              values: [is-6, is-12]
      - name: links
        label: Odkazy na zdroje
        type: object
        list: true
        fields:
          - name: label
            label: Text odkazu
            type: string
            required: true
          - name: url
            label: URL odkazu
            type: string
            required: true
      - name: body
        label: Text sekce (Markdown)
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: tweetone-en
    label: TweetONE Documentation (EN)
    type: collection
    path: src/content/tweetone/en
    format: yaml-frontmatter
    filename: "{title}.md"
    operations:
      rename: false
    view:
      primary: title
      fields: [order, title, eyebrow]
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: eyebrow
        label: Section eyebrow
        type: string
        required: true
      - name: title
        label: Section heading
        type: string
        required: true
      - name: order
        label: Section order
        type: number
        required: true
      - name: layout
        label: Section layout type
        type: select
        default: cards
        options:
          values: [overview, setup, hardware, cards, reference]
      - name: altBackground
        label: Use alternating section background
        type: boolean
        default: false
      - name: highlightBox
        label: Phase 0 highlight card
        type: object
        required: false
        fields:
          - name: eyebrow
            label: Card eyebrow
            type: string
            required: true
          - name: goal
            label: Goal
            type: text
            required: true
          - name: experiment
            label: Experiment
            type: text
            required: true
          - name: result
            label: Result
            type: text
            required: true
      - name: cards
        label: Section cards
        type: object
        list: true
        fields:
          - name: eyebrow
            label: Card eyebrow
            type: string
            required: false
          - name: title
            label: Card heading
            type: string
            required: false
          - name: date
            label: Date or period
            type: string
            required: false
          - name: text
            label: Card text
            type: text
            required: false
          - name: cause
            label: Problem cause
            type: text
            required: false
          - name: fix
            label: Problem fix
            type: text
            required: false
          - name: fixPrefix
            label: Fix text before inline code
            type: text
            required: false
          - name: inlineCode
            label: Inline code in fix
            type: string
            required: false
          - name: fixSuffix
            label: Fix text after inline code
            type: text
            required: false
          - name: items
            label: List items
            type: string
            list: true
            required: false
          - name: code
            label: Configuration or terminal code
            type: text
            required: false
          - name: column
            label: Card width in row
            type: select
            default: is-6
            options:
              values: [is-6, is-12]
      - name: links
        label: Reference links
        type: object
        list: true
        fields:
          - name: label
            label: Link text
            type: string
            required: true
          - name: url
            label: Link URL
            type: string
            required: true
      - name: body
        label: Section body (Markdown)
        type: rich-text
        options:
          format: markdown
          switcher: true
